<meta name="description" content="Pick every 2026 NFL game by win percentage and see projected win totals, playoff seeds and odds.">
<meta name="theme-color" content="#EDF1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B130F" media="(prefers-color-scheme: dark)">

<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>NFL Win Total Picker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column — matchup card on top, two team columns of confidence buttons beneath, fixed tab bar at the bottom. */
:root {
  --bg: #EDF1EC;
  --surface: #FFFFFF;
  --surface-2: #E2E8E2;
  --ink: #101A14;
  --muted: #5A6A60;
  --line: #C9D3CB;
  --accent: #E24E17;      /* pylon orange */
  --accent-ink: #FFFFFF;
  --chalk: rgba(16, 26, 20, .08);
  --L: 1;                 /* 1 = light theme, 0 = dark: picks team tint */
  --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --tab-h: 62px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B130F; --surface: #131E18; --surface-2: #1B2821; --ink: #E8EFE9;
    --muted: #8EA095; --line: #2A3A31; --accent: #FF6B33; --accent-ink: #1A0700;
    --chalk: rgba(232, 239, 233, .06); --L: 0; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B130F; --surface: #131E18; --surface-2: #1B2821; --ink: #E8EFE9;
  --muted: #8EA095; --line: #2A3A31; --accent: #FF6B33; --accent-ink: #1A0700;
  --chalk: rgba(232, 239, 233, .06); --L: 0; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible + .switch { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.app {
  max-width: 480px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(var(--tab-h) + 20px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 12px;
}

/* Header + field progress */
.top { display: flex; flex-direction: column; gap: 8px; }
.top-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.wordmark { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: .01em; text-transform: uppercase; margin: 0; line-height: 1; }
.wordmark span { color: var(--accent); }
.count { font-size: 13px; color: var(--muted); white-space: nowrap; }
.count b { color: var(--ink); font-weight: 700; }
.field {
  position: relative; height: 10px; border-radius: 3px; overflow: hidden;
  background:
    repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), var(--line) calc(10% - 1px) 10%),
    var(--surface-2);
}
.field i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent); border-radius: 3px; transition: width .35s ease; }

/* Week chips */
.weeks { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-inline: -4px; padding: 2px 4px 4px; }
.weeks::-webkit-scrollbar { display: none; }
.wk {
  flex: 0 0 auto; min-width: 44px; height: 36px; padding: 0 8px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center;
  font-family: var(--display); font-weight: 700; font-size: 17px; line-height: 1; position: relative;
}
.wk small { display: block; font-family: var(--body); font-size: 9px; font-weight: 600; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.wk.done { background: var(--surface-2); }
.wk.done::after { content: ""; position: absolute; top: 4px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.wk.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

/* Matchup card */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 10px 10px 14px; display: flex; flex-direction: column; gap: 10px;
  background-image: linear-gradient(90deg, transparent calc(50% - 1px), var(--chalk) calc(50% - 1px) calc(50% + 1px), transparent calc(50% + 1px));
}
.card.enter { animation: slideIn .22s ease-out; }
@keyframes slideIn { from { transform: translateX(18px); opacity: .35; } to { transform: none; opacity: 1; } }
.card.enter-back { animation: slideBack .22s ease-out; }
@keyframes slideBack { from { transform: translateX(-18px); opacity: .35; } to { transform: none; opacity: 1; } }
.card-head { display: grid; grid-template-columns: 76px 1fr 76px; align-items: center; gap: 4px; }
.nav { width: 76px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-family: var(--display); font-weight: 800; font-size: 14px; line-height: 1; color: var(--ink); }
.nav:disabled { opacity: .25; cursor: default; }
.when { text-align: center; font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); line-height: 1.3; }
.when b { color: var(--ink); }
.teams { display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 6px; }
.side { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; min-width: 0; }
.nick { font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1; text-transform: uppercase; letter-spacing: .01em; }
.loc { font-size: 13px; color: var(--muted); line-height: 1.1; }
.rec { font-size: 13px; font-weight: 600; }
.at { align-self: start; padding-top: 20px; font-family: var(--display); font-weight: 700; font-size: 20px; color: var(--muted); }
.score { font-family: var(--display); font-weight: 900; font-size: 28px; line-height: 1; }
.meta { text-align: center; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 12px; }
.meta b { color: var(--ink); font-weight: 600; }

/* Team badge (abbreviation in team colors) */
.badge {
  --bs: 64px; width: var(--bs); height: var(--bs); flex: 0 0 var(--bs); border-radius: 50%;
  display: grid; place-items: center; font-family: var(--display); font-weight: 900;
  font-size: calc(var(--bs) * .36); letter-spacing: .02em; line-height: 1;
  box-shadow: inset 0 0 0 calc(var(--bs) * .07) var(--ring), 0 0 0 1px var(--line);
  background: var(--tbg); color: var(--tfg);
}
.badge.sm { --bs: 34px; }
.badge.xs { --bs: 26px; }

/* Pick buttons */
.ask { display: flex; flex-direction: column; gap: 8px; }
.ask-q { font-size: 13px; font-weight: 600; color: var(--muted); text-align: center; margin: 0; }
.opt {
  --mix: calc(var(--L) * 100%);
  --tc: color-mix(in srgb, var(--ui-l) var(--mix), var(--ui-d));
  --tt: color-mix(in srgb, var(--uit-l) var(--mix), var(--uit-d));
  height: 48px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--tc) 30%, var(--line));
  background: color-mix(in srgb, var(--tc) calc(4% + var(--s) * 5%), var(--surface));
  display: flex; align-items: center; justify-content: center; gap: 2px;
  font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1;
  transition: transform .08s ease, background .12s ease;
}
.opt span { font-size: 15px; font-weight: 700; opacity: .7; }
.opt:active { transform: scale(.97); }
.opt.sel { background: var(--tc); color: var(--tt); border-color: var(--tc); }
.opt.sel span { opacity: .9; }
.toss {
  height: 46px; border-radius: 10px; border: 1px dashed var(--muted); background: var(--surface);
  font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: .03em; text-transform: uppercase;
}
.toss.sel { background: var(--ink); color: var(--bg); border-style: solid; border-color: var(--ink); }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.col { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.col-cap { text-align: center; font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.nextbtn { border: 0; border-radius: 10px; padding: 13px 18px; background: var(--ink); color: var(--bg); font-family: var(--display); font-weight: 800; font-size: 16px; letter-spacing: .02em; white-space: nowrap; }
.link { border: 0; background: transparent; padding: 8px 4px; font-size: 14px; font-weight: 600; color: var(--muted); }
.link:disabled { opacity: .35; cursor: default; }
.link.accent { color: var(--accent); }

.banner {
  border-radius: 12px; padding: 12px 14px; background: var(--ink); color: var(--bg);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.banner p { margin: 0; font-weight: 600; }
.banner button { border: 0; border-radius: 8px; padding: 8px 12px; background: var(--accent); color: var(--accent-ink); font-weight: 700; white-space: nowrap; }

/* Win totals */
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { border: 0; border-radius: 8px; padding: 8px; background: transparent; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.note b { color: var(--ink); }
.group { display: flex; flex-direction: column; }
.group-h {
  display: flex; justify-content: space-between; align-items: baseline; padding: 14px 2px 6px;
  font-family: var(--display); font-weight: 800; font-size: 18px; text-transform: uppercase; letter-spacing: .02em;
  border-bottom: 2px solid var(--ink);
}
.group-h small { font-family: var(--body); font-size: 11px; font-weight: 600; letter-spacing: .08em; color: var(--muted); }
.row {
  display: grid; grid-template-columns: 22px 34px minmax(0, 1fr) auto; align-items: center; gap: 10px;
  padding: 10px 2px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; width: 100%;
}
.rank { font-family: var(--display); font-weight: 700; font-size: 16px; color: var(--muted); text-align: right; }
.row-name { min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.row-name strong { font-weight: 700; font-size: 15px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-name strong em { font-style: normal; font-weight: 500; color: var(--muted); font-size: 13px; }
.bar { position: relative; height: 6px; border-radius: 3px; background: var(--surface-2); }
.bar i { position: absolute; inset: 0 auto 0 0; border-radius: 3px;
  background: color-mix(in srgb, var(--ui-l) calc(var(--L) * 100%), var(--ui-d)); }
.bar::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--muted); opacity: .6; }
.proj { text-align: right; line-height: 1; min-width: 74px; }
.proj b { font-family: var(--display); font-weight: 900; font-size: 26px; }
.proj span { font-family: var(--display); font-weight: 700; font-size: 16px; color: var(--muted); }
.proj small { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; }

.settings { margin-top: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 14px; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; }
.set-row + .set-row { border-top: 1px solid var(--line); }
.set-row p { margin: 0; }
.set-row p small { display: block; color: var(--muted); font-size: 13px; }
.tog { position: relative; flex: 0 0 auto; }
.tog input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch { display: block; width: 46px; height: 28px; border-radius: 14px; background: var(--line); position: relative; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.tog input:checked + .switch { background: var(--accent); }
.tog input:checked + .switch::after { transform: translateX(18px); }
.danger { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 8px 12px; font-weight: 600; white-space: nowrap; }
.danger.arm { background: #C62828; border-color: #C62828; color: #FFFFFF; }
.feedline { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.feedline .note { flex: 1; }
.danger:disabled { opacity: .5; cursor: default; }
.btns { display: flex; gap: 6px; flex: 0 0 auto; }
.filebtn { position: relative; overflow: hidden; cursor: pointer; display: inline-block; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.filebtn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.save-block { border-top: 1px solid var(--line); padding: 12px 0; }
.save-block > p { margin: 0; }
.save-block > p small { display: block; color: var(--muted); font-size: 13px; }
.save-form { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.save-form input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); padding: 9px 10px; font-size: 14px; font-weight: 600; }
.save-form .note { flex: 1; }
.state-list { display: flex; flex-direction: column; margin-top: 4px; }
.state-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.state-row b { font-size: 14px; }
.state-row small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }

/* Playoffs */
.sec-h {
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 14px 2px 6px;
  font-family: var(--display); font-weight: 800; font-size: 18px; text-transform: uppercase; letter-spacing: .02em;
  border-bottom: 2px solid var(--ink);
}
.sec-h small { font-family: var(--body); font-size: 11px; font-weight: 600; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.seed-row {
  display: grid; grid-template-columns: 30px 34px minmax(0, 1fr) auto; align-items: center; gap: 10px;
  padding: 10px 2px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; width: 100%;
}
.seed-n { font-family: var(--display); font-weight: 900; font-size: 28px; line-height: 1; text-align: center; }
.seed-row.out .seed-n { font-size: 20px; color: var(--muted); }
.seed-row.out .badge { opacity: .75; }
.seed-name { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.seed-name strong { font-weight: 700; font-size: 15px; line-height: 1.15; }
.seed-name .sub { font-size: 12px; color: var(--muted); }
.seed-name .why { font-size: 12px; color: var(--accent); font-weight: 600; }
.tag { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 2px 6px; border-radius: 5px; background: var(--surface-2); color: var(--muted); margin-left: 6px; vertical-align: 2px; }
.tag.bye { background: var(--accent); color: var(--accent-ink); }
.tag.dw { background: var(--ink); color: var(--bg); }
.odds { text-align: right; font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1; min-width: 56px; }
.odds small { display: block; font-family: var(--body); font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
.cutline { display: flex; align-items: center; gap: 8px; padding: 8px 2px 2px; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.cutline::before, .cutline::after { content: ""; flex: 1; border-top: 2px dashed var(--line); }
.mus { display: flex; flex-direction: column; gap: 8px; padding-top: 10px; }
.mu { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.mu-side { display: flex; align-items: center; gap: 8px; min-width: 0; }
.mu-side.h { justify-content: flex-end; text-align: right; }
.mu-side b { font-family: var(--display); font-weight: 800; font-size: 18px; text-transform: uppercase; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mu-side small { display: block; font-size: 11px; color: var(--muted); font-weight: 600; }
.mu-at { font-family: var(--display); font-weight: 700; color: var(--muted); font-size: 15px; }
.mu.bye { grid-template-columns: auto minmax(0, 1fr); color: var(--muted); }
.tblwrap { overflow-x: auto; }
.oddtab { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.oddtab th { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; text-align: right; padding: 8px 6px 6px; white-space: nowrap; }
.oddtab th:first-child, .oddtab td:first-child { text-align: left; }
.oddtab td { padding: 6px; border-bottom: 1px solid var(--line); text-align: right; font-weight: 700; font-size: 14px; }
.oddtab td.heat { background: color-mix(in srgb, var(--accent) calc(var(--p) * 38%), transparent); }
.oddtab .tm { display: flex; align-items: center; gap: 8px; font-weight: 600; white-space: nowrap; }
.oddtab tr { cursor: pointer; }
.simbar { height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; margin-top: 8px; }
.simbar i { display: block; height: 100%; background: var(--accent); width: 0; }
.fine { font-size: 12px; color: var(--muted); margin: 10px 0 0; }
.seedtag { display: inline-block; margin-left: 6px; padding: 1px 5px; border-radius: 4px; background: var(--ink); color: var(--bg); font-size: 10px; font-weight: 700; letter-spacing: .04em; vertical-align: 2px; }

/* My picks */
.score-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; align-items: center; }
.big { font-family: var(--display); font-weight: 900; font-size: 54px; line-height: .9; grid-row: span 3; }
.big small { display: block; font-family: var(--body); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.stat { font-size: 14px; color: var(--muted); }
.stat b { color: var(--ink); font-weight: 700; }
.cal { display: flex; flex-direction: column; }
.cal-row { display: grid; grid-template-columns: 52px minmax(0, 1fr) 64px; align-items: center; gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--line); }
.cal-lvl { font-family: var(--display); font-weight: 800; font-size: 20px; }
.cal-track { position: relative; height: 10px; border-radius: 5px; background: var(--surface-2); }
.cal-track i { position: absolute; inset: 0 auto 0 0; border-radius: 5px; background: var(--accent); }
.cal-track u { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 1px; }
.cal-n { text-align: right; font-size: 13px; font-weight: 700; line-height: 1.15; }
.cal-n small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); }
.pk {
  display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; gap: 10px;
  padding: 10px 2px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; width: 100%;
}
.pk-mu { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.pk-mu .ln { display: flex; align-items: center; gap: 6px; font-weight: 600; white-space: nowrap; }
.pk-mu .ln b { font-family: var(--display); font-weight: 800; font-size: 17px; min-width: 22px; text-align: right; }
.pk-mu .ln.lose { color: var(--muted); }
.pk-mu .ln.lose b { font-weight: 600; }
.pk-mu small { font-size: 12px; color: var(--muted); }
.pk-you { display: flex; align-items: center; gap: 6px; font-family: var(--display); font-weight: 800; font-size: 20px; }
.pk-you small { display: block; font-family: var(--body); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: right; }
.mark { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 14px; }

/* ---------- model ---------- */

/* ---------- playoff engine (NFL tie-breaking procedures) ---------- */
const TEAMS = Object.keys(T).sort();
const TI = Object.fromEntries(TEAMS.map((t, i) => [t, i]));
const NT = TEAMS.length, NG = GAMES.length, EPS = 1e-9;

const TG = TEAMS.map(() => []);                      // per team: [game, isHome, opponent]
GAMES.forEach((g, i) => { TG[GH[i]].push([i, 1, GA[i]]); TG[GA[i]].push([i, 0, GH[i]]); });
const OPPS = TG.map(list => new Set(list.map(x => x[2])));

function seasonFrom(h) {

}
const share = (s, x) => x[1] ? s.h[x[0]] : 1 - s.h[x[0]];
function pctVs(s, t, keep) {

}
function h2hNet(s, t, u) {            // >0: t beat u, <0: lost, 0: split or never played

const playedAll = set => set.every(t => set.some(u => u !== t && OPPS[t].has(u)));

  const counts = set.map(t => TG[t].filter(x => c.has(x[2])).length);

}
const ST = {
  h2h:    { name: "head-to-head", applies: (s, set) => playedAll(set), val: (s, t, set) => pctVs(s, t, o => set.includes(o)) },
  sweep:  { name: "head-to-head sweep",

  div:    { name: "division record", val: (s, t) => pctVs(s, t, o => DIVI[o] === DIVI[t]) },
  conf:   { name: "conference record", val: (s, t) => pctVs(s, t, o => CONF[o] === CONF[t]) },
  common: { name: "common games", prep: (s, set) => commonPrep(set), applies: (s, set, ctx) => ctx.counts.every(n => n >= 1),

  common4:{ name: "common games", prep: (s, set) => commonPrep(set), applies: (s, set, ctx) => ctx.counts.every(n => n >= 4),

// One club advances; if a step only trims the group, the rest go back to step 1.
function breakTie(s, set, stepsFor, rnd) {

/* ---------- season simulation ---------- */
const SIMS = 10000;
const SIM = { key: null, tally: null, done: 0, token: 0 };
const simKey = () => JSON.stringify([DATA_VER, S.useResults, S.picks]);
function ensureSim() {
  const key = simKey();
  if (SIM.key === key) return;
  SIM.key = key; SIM.tally = null; SIM.done = 0;
  const token = ++SIM.token;
  const fixed = new Uint8Array(NG), base = new Float64Array(NG), prob = new Float64Array(NG);
  GAMES.forEach((g, i) => {
    if (locked(g)) { fixed[i] = 1; base[i] = homeShare(g); }
    else { const p = S.picks[g.id]; prob[i] = p === undefined ? 0.5 : p / 100; }
  });
  const tally = { n: 0, po: new Uint32Array(NT), div: new Uint32Array(NT), bye: new Uint32Array(NT) };
  const h = new Float64Array(NG);
  const chunk = () => {
    if (token !== SIM.token) return;
    const end = Math.min(SIMS, tally.n + 250);
    for (; tally.n < end; tally.n++) {
      for (let i = 0; i < NG; i++) h[i] = fixed[i] ? base[i] : (Math.random() < prob[i] ? 1 : 0);
      const { seeds } = seedSeason(seasonFrom(h), Math.random, false);
      for (const list of seeds) list.forEach((t, k) => { tally.po[t]++; if (k < 4) tally.div[t]++; if (k === 0) tally.bye[t]++; });
    }
    SIM.done = tally.n;
    const bar = document.getElementById("simfill");
    if (bar) bar.style.width = (100 * tally.n / SIMS) + "%";
    if (tally.n < SIMS) setTimeout(chunk, 0);
    else { SIM.tally = tally; if (UI.view === "po") render(); }
  };
  setTimeout(chunk, 0);
}
function fmtOdds(c, n) {

  if (c === 0) return "0%";
  const v = 100 * c / n;
  return v < 1 ? "<1%" : v > 99 ? ">99%" : Math.round(v) + "%";

        <button type="button" class="danger${UI.armSave === "del-" + i ? " arm" : ""}" data-state-delete="${i}">${UI.armSave === "del-" + i ? "Tap again to delete" : "Delete"}</button>
      </span>
    </div>`).join("");
  $("view").innerHTML = `
    <div class="ask">
      <div class="seg" role="tablist">
        <button type="button" data-mode="div" class="${UI.tableMode === "div" ? "on" : ""}">Divisions</button>
        <button type="button" data-mode="conf" class="${UI.tableMode === "conf" ? "on" : ""}">Conferences</button>
      </div>
      <p class="note">${S.useResults ? `Real results through Week ${throughWeek()} are counted. ` : ""}${open ? `<b>${open}</b> games still unpicked count as 50/50.` : `Every game is picked.`} Tap a team to see its schedule.</p>
      ${body}
      <section class="settings">
        <div class="set-row">
          <p>Count real results<small>Finished games count 100% for the winner. Turn off to use your own picks for every game.</small></p>
          <label class="tog"><input type="checkbox" id="opt-results" ${S.useResults ? "checked" : ""} aria-label="Count real results"><span class="switch"></span></label>
        </div>
        <div class="set-row">
          <p>Scores<small data-feed-text>${feedText()}</small></p>
          <button type="button" class="danger" data-refresh ${FEED.state === "loading" ? "disabled" : ""}>Refresh</button>
        </div>
        <div class="set-row">
          <p>Back up picks<small>Picks save in this browser only. Download a backup to keep them safe or move them to another device.</small></p>
          <button type="button" class="danger" id="export">Download</button>
        </div>
        <div class="set-row">
          <p>Restore picks<small>${UI.pendingImport ? `Replace your ${Object.keys(S.picks).length} picks with the ${Object.keys(UI.pendingImport.picks).length} in this file?` : UI.importMsg || "Load a backup file you downloaded."}</small></p>
          ${UI.pendingImport
            ? `<span class="btns"><button type="button" class="danger" id="import-cancel">Cancel</button><button type="button" class="danger arm" id="import-yes">Replace</button></span>`
            : `<label class="danger filebtn">Choose file<input type="file" id="import-file" accept=".json,application/json"></label>`}
        </div>
        <div class="save-block">
          <p>Save states<small>Keep different sets of picks in this browser. "My picks" is the set you started with, and "Clear" is a blank set. Loading a state replaces your current picks, so save them first if you want to keep them.</small></p>
          <div class="save-form">
            <input id="save-name" type="text" placeholder="Name for your current picks" value="${esc(UI.saveName || "")}" aria-label="Name for current picks">
            <button type="button" class="danger" data-save-current>Save current picks</button>
          </div>
          <div class="save-form">
            <button type="button" class="danger" data-save-clear>Save a clear state</button>
            <span class="note">${UI.saveMsg ? esc(UI.saveMsg) : "Saved states stay in this browser only."}</span>
          </div>
          <div class="state-list">
            ${statesHtml || `<p class="note">No save states yet.</p>`}
          </div>
        </div>
        <div class="set-row">
          <p>Start over<small>Clears your ${GAMES.filter(g => !played(g) && S.picks[g.id] !== undefined).length} picks for games not played yet. Picks on finished games stay in your record.</small></p>
          <button type="button" class="danger${UI.resetArmed ? " arm" : ""}" id="reset">${UI.resetArmed ? "Tap again to erase" : "Reset picks"}</button>
        </div>
      </section>

    </div>`;
}

function renderPlayoffs() {
  ensureSim();
  const s = expectedSeason();
  const r = seedSeason(s, null, true);
  const c = UI.conf, order = r.seeds[c], cname = c ? "NFC" : "AFC";
  const tally = SIM.tally;
  const odds = (arr, i) => tally ? fmtOdds(arr[i], tally.n) : "…";
  const proj = i => fx(s.W[i]) + "–" + fx(17 - s.W[i]);
  const nick = i => T[TEAMS[i]].nick;
  const whyText = i => {
    const k = order.indexOf(i), out = [];
    const line = (w, what) => `<span class="why">${what} over ${w.over.map(o => TEAMS[o]).join(", ")} on ${w.reason}</span>`;
    if (k < 4 && r.divWhy[i]) out.push(line(r.divWhy[i], "Won division"));
    if (r.seedWhy[i]) out.push(line(r.seedWhy[i], k < 4 ? "Seeded ahead" : k < 7 ? "Won wild card" : "Ranked ahead"));
    return out.join("");
  };
  const row = (i, k) => {
    const t = TEAMS[i], seed = k + 1, out = seed > 7;
    const tag = seed === 1 ? `<span class="tag bye">Bye</span>` : seed <= 4 ? `<span class="tag dw">${T[t].div.split(" ")[1]} champ</span>` : seed <= 7 ? `<span class="tag">Wild card</span>` : "";
    return `<button class="seed-row${out ? " out" : ""}" type="button" data-team="${t}">
      <span class="seed-n num">${seed}</span>${badge(t, "sm")}
      <span class="seed-name"><strong>${T[t].nick}${tag}</strong>
        <span class="sub num">Projected ${proj(i)}</span>${whyText(i)}</span>
      <span class="odds num">${odds(tally ? tally.po : null, i)}<small>Playoffs</small></span>
    </button>`;
  };
  const side = (k, home) => {
    const i = order[k], t = TEAMS[i];
    return `<div class="mu-side${home ? " h" : ""}">${home ? "" : badge(t, "xs")}<span><b>${nick(i)}</b><small>${k + 1} seed</small></span>${home ? badge(t, "xs") : ""}</div>`;
  };
  const mus = [[6, 1], [5, 2], [4, 3]].map(([a, h]) => `<div class="mu">${side(a, false)}<span class="mu-at">at</span>${side(h, true)}</div>`).join("");
  const confTeams = TEAMS.map((t, i) => i).filter(i => CONF[i] === c);
  const sorted = confTeams.slice().sort((a, b) => tally ? (tally.po[b] - tally.po[a] || s.W[b] - s.W[a]) : s.W[b] - s.W[a]);
  const cell = (arr, i) => {
    const p = tally ? arr[i] / tally.n : 0;
    return `<td class="heat num" style="--p:${p.toFixed(3)}">${odds(arr, i)}</td>`;
  };
  const table = sorted.map(i => `<tr data-team="${TEAMS[i]}"><td><span class="tm">${badge(TEAMS[i], "xs")}${nick(i)}</span></td>
      <td class="num">${fx(s.W[i])}</td>${cell(tally && tally.po, i)}${cell(tally && tally.div, i)}${cell(tally && tally.bye, i)}</tr>`).join("");
  const open = queue().filter(g => S.picks[g.id] === undefined).length;

  $("view").innerHTML = `
    <div class="ask">
      <div class="seg" role="tablist">
        <button type="button" data-conf="0" class="${c === 0 ? "on" : ""}">AFC</button>
        <button type="button" data-conf="1" class="${c === 1 ? "on" : ""}">NFC</button>
      </div>
      <p class="note">Seeds come from your projected records. Division champions take seeds 1–4, and the three best other teams are wild cards. Ties are broken with the NFL's tiebreakers.${open ? ` <b>${open}</b> unpicked games count as 50/50.` : ""}</p>
      <section>
        <div class="sec-h">${cname} seeds<small>Playoff odds</small></div>
        ${order.slice(0, 7).map(row).join("")}
        <div class="cutline">Out of the playoffs</div>
        ${order.slice(7, 10).map((i, k) => row(i, k + 7)).join("")}
      </section>
      <section>
        <div class="sec-h">Wild Card Round<small>Higher seed hosts</small></div>
        <div class="mus">
          <div class="mu bye">${badge(TEAMS[order[0]], "xs")}<span><b style="font-family:var(--display);font-weight:800;font-size:18px;text-transform:uppercase;color:var(--ink)">${nick(order[0])}</b> · 1 seed, first-round bye</span></div>
          ${mus}
        </div>
      </section>
      <section>
        <div class="sec-h">${cname} playoff odds<small>${tally ? SIMS.toLocaleString() + " seasons" : "Simulating"}</small></div>
        ${tally ? "" : `<div class="simbar"><i id="simfill" style="width:${100 * SIM.done / SIMS}%"></i></div>`}
        <div class="tblwrap"><table class="oddtab">
          <thead><tr><th>Team</th><th>Proj W</th><th>Playoffs</th><th>Division</th><th>1 seed</th></tr></thead>
          <tbody>${table}</tbody>
        </table></div>
        <p class="fine">Odds come from ${SIMS.toLocaleString()} seasons played out with your percentages, seeded with the same tiebreakers. Simulated games have no scores, so the point-based tiebreakers are skipped and a coin toss decides.</p>
      </section>
    </div>`;
}

/* ---------- pick record ---------- */
function grade(g) {
  const p = S.picks[g.id];
  if (p === undefined || !played(g)) return null;
  const tie = g.hs === g.as, homeWon = g.hs > g.as;
  const side = p > 50 ? g.home : p < 50 ? g.away : null;
  const conf = Math.max(p, 100 - p);
  let res = "N";
  if (side && !tie) res = (side === g.home) === homeWon ? "R" : "X";
  return { g, p, side, conf, res };
}
function renderRecord() {
  const graded = GAMES.map(grade).filter(Boolean);
  const upcoming = GAMES.filter(g => !played(g) && S.picks[g.id] !== undefined);
  const unpicked = GAMES.filter(g => !played(g) && S.picks[g.id] === undefined).length;
  const scored = graded.filter(x => x.res !== "N");
  const right = scored.filter(x => x.res === "R").length, wrong = scored.length - right;
  const expected = scored.reduce((a, x) => a + x.conf / 100, 0);
  const tossups = graded.filter(x => x.side === null).length;
  const mode = UI.recMode;

  const pickCell = x => x.side
    ? `<span class="pk-you">${badge(x.side, "xs")}<span class="num">${x.conf}%</span></span>`
    : `<span class="pk-you"><span>50/50</span></span>`;
  const line = (t, score, lose) => `<span class="ln${lose ? " lose" : ""}">${badge(t, "xs")}${T[t].nick}${score !== undefined ? `<b class="num">${score}</b>` : ""}</span>`;
  const byWeek = (list, desc) => {
    const wks = [...new Set(list.map(x => (x.g || x).wk))].sort((a, b) => desc ? b - a : a - b);
    return wks.map(w => ({ w, items: list.filter(x => (x.g || x).wk === w) }));
  };

  let body = "";
  if (mode === "res") {
    const lvls = [60, 70, 80, 90, 100].map(l => {
      const xs = scored.filter(x => x.conf === l), r = xs.filter(x => x.res === "R").length;
      return { l, n: xs.length, r };
    }).filter(c => c.n);
    body = graded.length ? `
      <div class="score-card">
        <div class="big num">${right}–${wrong}<small>Right–wrong</small></div>
        <div class="stat">You expected <b class="num">${fx(expected)}</b> right from your percentages.</div>
        <div class="stat"><b class="num">${scored.length ? Math.round(100 * right / scored.length) : 0}%</b> of picks correct${tossups ? ` · <b>${tossups}</b> toss-up${tossups > 1 ? "s" : ""} not counted` : ""}.</div>
        <div class="stat">Finished games count 100% for the winner in your totals.</div>
      </div>
      ${lvls.length ? `<section>
        <div class="sec-h">How sure vs. how right<small>Line = your %</small></div>
        <div class="cal">${lvls.map(c => `
          <div class="cal-row">
            <span class="cal-lvl num">${c.l}%</span>
            <span class="cal-track" aria-label="${c.r} of ${c.n} right at ${c.l} percent"><i style="width:${(100 * c.r / c.n).toFixed(1)}%"></i><u style="left:${c.l}%"></u></span>
            <span class="cal-n num">${Math.round(100 * c.r / c.n)}%<small>${c.r} of ${c.n}</small></span>
          </div>`).join("")}</div>
      </section>` : ""}
      ${byWeek(graded, true).map(({ w, items }) => {
        const r = items.filter(x => x.res === "R").length, x2 = items.filter(x => x.res === "X").length;
        return `<section><div class="sec-h">Week ${w}<small class="num">${r}–${x2}</small></div>
          ${items.map(x => {
            const g = x.g, hw = g.hs > g.as, aw = g.as > g.hs;
            const lbl = x.res === "R" ? "Right" : x.res === "X" ? "Wrong" : "Not graded";
            return `<div class="pk">
              <span class="mark ${x.res}" role="img" aria-label="${lbl}">${x.res === "R" ? "✓" : x.res === "X" ? "✗" : "–"}</span>
              <span class="pk-mu">${line(g.away, g.as, !aw)}${line(g.home, g.hs, !hw)}</span>
              ${pickCell(x)}
            </div>`;
          }).join("")}</section>`;
      }).join("")}` : `<div class="empty"><b>No results yet</b>Picks get graded here once their games are final.</div>`;
  } else {
    body = upcoming.length ? byWeek(upcoming, false).map(({ w, items }) => `
      <section><div class="sec-h">Week ${w}<small class="num">${items.length} picked</small></div>
        ${items.map(g => {
          const x = { side: S.picks[g.id] > 50 ? g.home : S.picks[g.id] < 50 ? g.away : null, conf: Math.max(S.picks[g.id], 100 - S.picks[g.id]) };
          return `<button class="pk" type="button" data-goto="${g.id}">
            <span class="mark N" aria-hidden="true">›</span>
            <span class="pk-mu">${line(g.away)}${line(g.home)}<small>${fmtDate(g)} · ${fmtTime(g.time)}</small></span>
            ${pickCell(x)}
          </button>`;
        }).join("")}</section>`).join("")
      : `<div class="empty"><b>Nothing picked yet</b>Picks for upcoming games show up here.</div>`;
  }

  $("view").innerHTML = `
    <div class="ask">
      <div class="seg" role="tablist">
        <button type="button" data-rec="res" class="${mode === "res" ? "on" : ""}">Results · ${graded.length}</button>
        <button type="button" data-rec="up" class="${mode === "up" ? "on" : ""}">Upcoming · ${upcoming.length}</button>
      </div>
      ${mode === "up" && unpicked ? `<p class="note"><b>${unpicked}</b> upcoming games still need a pick. Tap a game to change your pick.</p>` : ""}
      ${mode === "res" ? `<div class="feedline"><p class="note" data-feed-text>${feedText()}</p><button type="button" class="danger" data-refresh ${FEED.state === "loading" ? "disabled" : ""}>Refresh</button></div><p class="note">Your original picks are kept even after the game is final.</p>` : ""}
      ${body}
    </div>`;
}

function renderSheet() {
  const root = $("sheet-root");
  if (!UI.team) { root.innerHTML = ""; return; }
  const t = UI.team, d = T[t], r = standings()[t];
  const rows = r.games.map(g => {
    const home = g.home === t, opp = home ? g.away : g.home;
    let right;
    if (locked(g)) {
      const my = home ? g.hs : g.as, their = home ? g.as : g.hs, res = my > their ? "W" : my < their ? "L" : "T";
      right = `<span class="chip ${res}">${res}</span> <span class="num">${my}–${their}</span>`;
    } else {
      const h = homeShare(g);
      right = h === null ? `<span class="unp">Pick</span>` : `<span class="num">${Math.round(100 * (home ? h : 1 - h))}%</span>`;
    }
    return `<button class="g" type="button" data-goto="${locked(g) ? "" : g.id}" ${locked(g) ? "disabled" : ""}>
      <span class="w">W${g.wk}</span>${badge(opp, "xs")}
      <span class="o">${home ? "vs" : "@"} ${T[opp].nick} <em>· ${locked(g) && S.picks[g.id] !== undefined ? `you had ${home ? S.picks[g.id] : 100 - S.picks[g.id]}%` : fmtDate(g)}</em></span>
      <span class="r">${right}</span>
    </button>`;
  }).join("");
  root.innerHTML = `
    <div class="scrim" data-close></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="${d.loc} ${d.nick} schedule">
      <div class="sheet-in">
        <div class="sheet-h">
          ${badge(t, "")}
          <div><h2>${d.nick}</h2><p class="num">Projected ${fx(r.w)}–${fx(r.l)}${S.useResults ? ` · Now ${record(r)}` : ""}</p></div>
          <button class="x" type="button" data-close aria-label="Close">✕</button>
        </div>
        <div class="sched">${rows}</div>
      </div>
    </div>`;
}

function render() {
  renderTop();
  for (const [id, v] of [["tab-pick", "pick"], ["tab-table", "table"], ["tab-po", "po"], ["tab-rec", "rec"]]) {
    $(id).classList.toggle("on", UI.view === v);
    $(id).setAttribute("aria-current", UI.view === v);
  }
  if (UI.view === "pick") renderPick(); else if (UI.view === "table") renderTable(); else if (UI.view === "po") renderPlayoffs(); else renderRecord();
  renderSheet();
}

/* ---------- actions ---------- */
let busy = false;
function choose(p) {
  if (busy) return;
  const id = UI.cursor; if (!id) return;
  S.picks[id] = p; persist();
  const btn = document.querySelector(`[data-p="${p}"]`);
  document.querySelectorAll(".opt.sel, .toss.sel").forEach(b => b.classList.remove("sel"));
  if (btn) btn.classList.add("sel");
  renderTop();
  busy = true;
  setTimeout(() => {
    busy = false;
    const next = firstOpen(id);
    if (next) { UI.cursor = next; UI.dir = 1; UI.anim = true; }
    saveLocal(); render();
  }, 170);
}
function step(d) {
  const q = queue(), i = q.findIndex(g => g.id === UI.cursor), n = q[i + d];
  if (n) { UI.cursor = n.id; UI.dir = d; UI.anim = true; saveLocal(); render(); }
}
document.addEventListener("click", e => {
  const el = e.target.closest("button, [data-close]");
  if (!el) return;
  if (el.id === "tab-pick") { UI.view = "pick"; UI.resetArmed = false; UI.armSave = null; render(); window.scrollTo(0, 0); return; }
  if (el.id === "tab-table") { UI.view = "table"; UI.armSave = null; render(); window.scrollTo(0, 0); return; }
  if (el.id === "tab-po") { UI.view = "po"; UI.resetArmed = false; UI.armSave = null; render(); window.scrollTo(0, 0); return; }
  if (el.id === "tab-rec") { UI.view = "rec"; UI.resetArmed = false; UI.armSave = null; render(); window.scrollTo(0, 0); return; }
  if (el.dataset.rec) { UI.recMode = el.dataset.rec; return render(); }
  if (el.dataset.conf) { UI.conf = +el.dataset.conf; return render(); }
  if (el.hasAttribute("data-close")) { UI.team = null; renderSheet(); return; }
  if (el.dataset.p !== undefined) return choose(+el.dataset.p);
  if (el.dataset.step) return step(+el.dataset.step);
  if (el.hasAttribute("data-skip")) {
    const q = queue(); const i = q.findIndex(g => g.id === UI.cursor);
    const next = firstOpen(UI.cursor) || (q[i + 1] || q[0]).id;
    UI.cursor = next; UI.dir = 1; UI.anim = true; saveLocal(); return render();
  }
  if (el.hasAttribute("data-clear")) { delete S.picks[UI.cursor]; persist(); return render(); }
  if (el.dataset.wk) {
    const w = +el.dataset.wk, wg = queue().filter(g => g.wk === w);
    const g = wg.find(x => S.picks[x.id] === undefined) || wg[0];
    UI.dir = g.i >= (BYID[UI.cursor] || g).i ? 1 : -1; UI.anim = true; UI.cursor = g.id; saveLocal(); return render();
  }
  if (el.dataset.go === "table") { UI.view = "table"; render(); window.scrollTo(0, 0); return; }
  if (el.dataset.mode) { UI.tableMode = el.dataset.mode; return render(); }
  if (el.dataset.team) { UI.team = el.dataset.team; return renderSheet(); }
  if (el.dataset.goto) { UI.cursor = el.dataset.goto; UI.team = null; UI.view = "pick"; UI.dir = 1; saveLocal(); render(); window.scrollTo(0, 0); return; }
  if (el.hasAttribute("data-refresh")) return refreshScores(true);
  if (el.id === "export") return downloadPicks();
  if (el.id === "import-cancel") { UI.pendingImport = null; UI.importMsg = ""; return render(); }
  if (el.id === "import-yes") {
    S.picks = UI.pendingImport.picks; S.useResults = UI.pendingImport.useResults; UI.pendingImport = null;
    UI.importMsg = "Picks restored."; persist(); UI.cursor = firstOpen(); return render();
  }
  if (el.hasAttribute("data-save-current")) {
    const input = document.getElementById("save-name");
    const name = (input ? input.value : UI.saveName || "").trim();
    if (!name) { UI.saveMsg = "Give this save a name first."; return render(); }
    const list = loadStates();
    const entry = { name, picks: { ...S.picks }, useResults: S.useResults, updatedAt: Date.now() };
    const existing = list.findIndex(st => st.name === name);
    if (existing >= 0) list[existing] = entry; else list.push(entry);
    saveStates(list); UI.saveName = ""; UI.armSave = null;
    UI.saveMsg = `Saved "${name}" with ${Object.keys(S.picks).length} picks.`;
    return render();
  }
  if (el.hasAttribute("data-save-clear")) {
    const list = loadStates();
    const entry = { name: "Clear", picks: {}, useResults: true, updatedAt: Date.now() };
    const existing = list.findIndex(st => st.name === "Clear");
    if (existing >= 0) list[existing] = entry; else list.push(entry);
    saveStates(list); UI.armSave = null;
    UI.saveMsg = "Clear state saved — a blank set of picks.";
    return render();
  }
  if (el.dataset.stateLoad !== undefined) {
    const i = +el.dataset.stateLoad, st = loadStates()[i];
    if (!st) return;
    if (UI.armSave !== "load-" + i) {
      UI.armSave = "load-" + i; render();
      setTimeout(() => { if (UI.armSave === "load-" + i) { UI.armSave = null; if (UI.view === "table") render(); } }, 4000);
      return;
    }
    UI.armSave = null; S.picks = { ...st.picks }; S.useResults = st.useResults;
    UI.saveMsg = `Loaded "${st.name}".`; persist(); UI.cursor = firstOpen(); return render();
  }
  if (el.dataset.stateOverwrite !== undefined) {
    const i = +el.dataset.stateOverwrite, list = loadStates(), st = list[i];
    if (!st) return;
    if (UI.armSave !== "over-" + i) {
      UI.armSave = "over-" + i; render();
      setTimeout(() => { if (UI.armSave === "over-" + i) { UI.armSave = null; if (UI.view === "table") render(); } }, 4000);
      return;
    }
    list[i] = { name: st.name, picks: { ...S.picks }, useResults: S.useResults, updatedAt: Date.now() };
    saveStates(list); UI.armSave = null;
    UI.saveMsg = `Overwrote "${st.name}" with your current picks.`;
    return render();
  }
  if (el.dataset.stateDelete !== undefined) {
    const i = +el.dataset.stateDelete, list = loadStates(), st = list[i];
    if (!st) return;
    if (UI.armSave !== "del-" + i) {
      UI.armSave = "del-" + i; render();
      setTimeout(() => { if (UI.armSave === "del-" + i) { UI.armSave = null; if (UI.view === "table") render(); } }, 4000);
      return;
    }
    saveStates(list.filter((_, k) => k !== i)); UI.armSave = null;
    UI.saveMsg = `Deleted "${st.name}".`;
    return render();
  }
  if (el.id === "reset") {
    if (!UI.resetArmed) { UI.resetArmed = true; render(); setTimeout(() => { if (UI.resetArmed) { UI.resetArmed = false; if (UI.view === "table") render(); } }, 4000); return; }
    UI.resetArmed = false;
    for (const id in S.picks) if (!played(BYID[id])) delete S.picks[id];
    persist(); UI.cursor = firstOpen(); return render();
  }
});
document.addEventListener("click", e => {
  const tr = e.target.closest("tr[data-team]");
  if (tr) { UI.team = tr.dataset.team; renderSheet(); }
});
document.addEventListener("change", e => {
  if (e.target.id === "save-name") { UI.saveName = e.target.value; return; }
  if (e.target.id === "import-file" && e.target.files && e.target.files[0]) { readImport(e.target.files[0]); return; }
  if (e.target.id === "opt-results") { S.useResults = e.target.checked; persist(); if (!inQueue(BYID[UI.cursor])) UI.cursor = firstOpen(); render(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && UI.team) { UI.team = null; renderSheet(); }
  if (UI.view !== "pick" || UI.team) return;
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});

/* ---------- boot ---------- */
(function boot() {
  loadCachedScores();
  const local = loadLocal();
  if (local) Object.assign(S, local);
  else if (SEED) { Object.assign(S, clean(SEED)); S.updatedAt = Date.now(); saveLocal(); }
  ensureSeedStates();
  try { const raw = JSON.parse(localStorage.getItem(LS_KEY) || "null"); if (raw && BYID[raw.cursor]) UI.cursor = raw.cursor; } catch (e) {}
  if (!UI.cursor || !inQueue(BYID[UI.cursor])) UI.cursor = firstOpen();
  render();
  if (Date.now() - FEED.checkedAt > FEED_MAX_AGE) refreshScores(false);
})();
</script>

</body>
